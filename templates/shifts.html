{% extends "base.html" %}

{% block content %}

<h1>Shifts</h1>

<a href="/shifts/add">Add Shift</a>

<hr>

{% for shift in shifts %}

<div>

    <h3>{{ shift.employee_name }}</h3>

    <p>Date: {{ shift.shift_date }}</p>

    <p>Time: {{ shift.start_time }} - {{ shift.end_time }}</p>

    <p>Notes: {{ shift.notes }}</p>

</div>

<hr>

{% endfor %}

{% endblock %}
