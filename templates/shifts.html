{% extends "base.html" %}

{% block content %}

<h1>Shifts</h1>

<a href="/shifts/add" class="btn btn-primary mb-3">
    Add Shift
</a>

<hr>

{% for shift in shifts %}

<div>

    <h3>{{ shift.employee_name }}</h3>

    <p>Date: {{ shift.shift_date }}</p>

    <p>Time: {{ shift.start_time }} - {{ shift.end_time }}</p>

    <p>Notes: {{ shift.notes }}</p>

    <a href="/shifts/edit/{{ shift.id }}" class="btn btn-warning btn-sm">
    Edit
    </a>

    <a href="/shifts/delete/{{ shift.id }}" class="btn btn-danger btn-sm">
    Delete
    </a>

</div>

<hr>

{% endfor %}

{% endblock %}
