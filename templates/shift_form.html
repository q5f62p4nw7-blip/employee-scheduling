{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <h1 class="mb-4 text-center">

            {% if shift %}
                Edit Shift
            {% else %}
                Add Shift
            {% endif %}

        </h1>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Employee
                </label>

                <select name="employee_id" class="form-select" required>

                    {% for employee in employees %}

                        <option
                            value="{{ employee.id }}"

                            {% if shift and shift.employee_id == employee.id %}
                                selected
                            {% endif %}
                        >
                            {{ employee.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Date
                </label>

                <input
                    type="date"
                    name="shift_date"
                    class="form-control"
                    value="{{ shift.shift_date if shift else '' }}"
                    required
                >

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Start Time
                    </label>

                    <input
                        type="time"
                        name="start_time"
                        class="form-control"
                        value="{{ shift.start_time if shift else '' }}"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        End Time
                    </label>

                    <input
                        type="time"
                        name="end_time"
                        class="form-control"
                        value="{{ shift.end_time if shift else '' }}"
                        required
                    >

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Notes
                </label>

                <textarea
                    name="notes"
                    class="form-control"
                    rows="4"
                    placeholder="Enter shift notes..."
                >{{ shift.notes if shift else '' }}</textarea>

            </div>

            <button type="submit" class="btn btn-primary w-100">

                {% if shift %}
                    Update Shift
                {% else %}
                    Add Shift
                {% endif %}

            </button>

        </form>

    </div>

</div>

{% endblock %}
