{% extends "base.html" %}

{% block content %}

<h1>

    {% if shift %}
        Edit Shift
    {% else %}
        Add Shift
    {% endif %}

</h1>

<form method="POST">

    <label>Employee</label>

    <br><br>

    <select name="employee_id" required>

        {% for employee in employees %}

            <option
                value="{{ employee.id }}"

                {% if shift and shift.employee_id == employee.id %}
                    selected
                {% endif %}
            >

                {{ employee.name }}

            </option>

        {% endfor %}

    </select>

    <br><br>

    <label>Date</label>

    <br><br>

    <input
        type="date"
        name="shift_date"
        value="{{ shift.shift_date if shift else '' }}"
        required
    >

    <br><br>

    <label>Start Time</label>

    <br><br>

    <input
        type="time"
        name="start_time"
        value="{{ shift.start_time if shift else '' }}"
        required
    >

    <br><br>

    <label>End Time</label>

    <br><br>

    <input
        type="time"
        name="end_time"
        value="{{ shift.end_time if shift else '' }}"
        required
    >

    <br><br>

    <label>Notes</label>

    <br><br>

    <textarea
        name="notes"
        rows="4"
        cols="40"
    >{{ shift.notes if shift else '' }}</textarea>

    <br><br>

    <button type="submit">

        {% if shift %}
            Update Shift
        {% else %}
            Add Shift
        {% endif %}

    </button>

</form>

{% endblock %}
