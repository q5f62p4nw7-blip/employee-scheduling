{% extends "base.html" %}

{% block content %}

<h1>Dashboard</h1>

<p>
    Welcome,
    {{ session.username }}
</p>

<hr>

<h3>Statistics</h3>

<p>
    Total Employees:
    {{ employee_count }}
</p>

<p>
    Total Shifts:
    {{ shift_count }}
</p>

<hr>

<h3>Quick Actions</h3>

<div class="quick-actions">

    <a href="/employees" class="action-card">
        👥 View Employees
    </a>

    <a href="/employees/add" class="action-card">
        ➕ Add Employee
    </a>

    <a href="/shifts" class="action-card">
        📅 View Shifts
    </a>

    <a href="/shifts/add" class="action-card">
        ⏰ Add Shift
    </a>

</div>

{% endblock %}
