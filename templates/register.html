{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <h1 class="mb-4 text-center">Create Account</h1>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>

        </form>

        <p class="text-center mt-3">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
