{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <h1 class="mb-4 text-center">

            {% if employee %}
                Edit Employee
            {% else %}
                Add Employee
            {% endif %}

        </h1>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Employee Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter employee name"
                    value="{{ employee.name if employee else '' }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Position
                </label>

                <input
                    type="text"
                    name="position"
                    class="form-control"
                    placeholder="Enter position"
                    value="{{ employee.position if employee else '' }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter employee email"
                    value="{{ employee.email if employee else '' }}"
                >

            </div>

            <button type="submit" class="btn btn-primary w-100">

                {% if employee %}
                    Update Employee
                {% else %}
                    Save Employee
                {% endif %}

            </button>

        </form>

    </div>

</div>

{% endblock %}
