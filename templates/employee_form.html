{% extends "base.html" %}

{% block content %}

<h1>Add Employee</h1>

<form method="POST">

    <input
        type="text"
        name="name"
        placeholder="Employee Name"
        required
    >

    <br><br>

    <input
        type="text"
        name="position"
        placeholder="Position"
        required
    >

    <br><br>

    <input
        type="email"
        name="email"
        placeholder="Email"
    >

    <br><br>

    <button type="submit">
        Add Employee
    </button>

</form>

{% endblock %}
